services:
  web:
    image: nginx:alpine
    ports:
      # PORT is set by launch.sh (default 8080)
      - "${PORT:-8080}:80"
    volumes:
      # Mount static files for live reload during development
      - ./static:/usr/share/nginx/html/static
      - ./index.html:/usr/share/nginx/html/index.html
      - ./index_advanced.html:/usr/share/nginx/html/index_advanced.html
      # Ensure PWA assets are served at site root
      - ./manifest.webmanifest:/usr/share/nginx/html/manifest.webmanifest:ro
      - ./sw.js:/usr/share/nginx/html/sw.js:ro
      - ./conf_files:/usr/share/nginx/html/conf_files:ro
      # Static files + /ntrip/stream proxied to the NTRIP caster (rendered with the NTRIP_* variables)
      - ./nginx/templates:/etc/nginx/templates:ro
    restart: unless-stopped
    environment:
      # Enable live reload in development
      NGINX_HOST: localhost
      NGINX_PORT: 80
      # Centipede-RTK caster, NEAR4 = closest base to the position sent by the page,
      # MSM4 (same signals as NEAR/MSM7, half the bandwidth: better over BLE)
      NTRIP_HOST: caster.centipede.fr
      NTRIP_PORT: "2101"
      NTRIP_MOUNT: NEAR4
      # base64 of "user:password" (centipede:centipede)
      NTRIP_BASIC_AUTH: Y2VudGlwZWRlOmNlbnRpcGVkZQ==

  # Optional: File watcher service for development
  file-watcher:
    image: node:alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: |
      sh -c 'npm install -g chokidar-cli 2>/dev/null || true &&
             chokidar "static/**/*" "index.html" "index_advanced.html"
             --initial --command "echo \"Files changed at \$(date)\" && ls -la static/ 2>/dev/null || true"'
    restart: unless-stopped
    profiles:
      - watch # Use: docker-compose --profile watch up
