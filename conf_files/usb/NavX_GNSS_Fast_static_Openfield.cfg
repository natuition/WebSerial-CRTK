# title: Configuration du GNSS de NavX (GNSS UM980)
# content: Configuration FAST STATIC OPENFIELD : remplace les sorties NMEA par les observations brutes et les éphémérides (binaire) pour le calcul en post-traitement.
# content: Masque d’élévation à 5°, adapté aux milieux ouverts, sans masque autour de l’antenne.
FRESET
VERSIONA
CONFIG ANTENNA POWERON
MODE ROVER SURVEY
MASK 5
MASK QZSS
UNMASK GLO
UNMASK BDS
UNMASK GPS
UNMASK GAL
CONFIG COM2 921600 8 n 1
GPSEPHB COM2 ONCHANGED
GLOEPHB COM2 ONCHANGED
GALEPHB COM2 ONCHANGED
BDSEPHB COM2 ONCHANGED
BD3EPHB COM2 ONCHANGED
OBSVMCMPB COM2 1
SAVECONFIG
CONFIG SIGNALGROUP 2
