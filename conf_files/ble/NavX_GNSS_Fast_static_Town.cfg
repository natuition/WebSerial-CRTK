# title: Configuration du GNSS de NavX (GNSS UM980) via BLE
# content: Configuration FAST STATIC TOWN : remplace les sorties NMEA par les observations brutes et les éphémérides (binaire) pour le calcul en post-traitement.
# content: Masque d’élévation à 15°, adapté à la ville, aux lisières de forêt et aux milieux encaissés.
UNLOG COM2
CONFIG ANTENNA POWERON
MASK 15
MASK QZSS
UNMASK GPS
UNMASK GLO
UNMASK GAL
UNMASK BDS
GPSEPHB COM2 ONCHANGED
GLOEPHB COM2 ONCHANGED
GALEPHB COM2 ONCHANGED
BDSEPHB COM2 ONCHANGED
BD3EPHB COM2 ONCHANGED
OBSVMCMPB COM2 1
SAVECONFIG