# title: Configuration du GNSS de NavX (GNSS UM980) via BLE donc pas de FRESET
# content: Configuration FAST STATIC : sortie des observations brutes et des éphémérides pour le post-traitement.
# content: Cette configuration remplace les sorties NMEA du COM2 par les messages binaires nécessaires au calcul en fast static.
UNLOG COM2
CONFIG ANTENNA POWERON
MASK 15
MASK QZSS
UNMASK GPS
UNMASK GLO
UNMASK GAL
UNMASK BDS
GPSEPHB COM2 ONCHANGED
GLOEPHB COM2 ONCHANGED
GALEPHB COM2 ONCHANGED
BDSEPHB COM2 ONCHANGED
BD3EPHB COM2 ONCHANGED
OBSVMCMPB COM2 1
SAVECONFIG